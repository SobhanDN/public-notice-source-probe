name: Public notice source probe

on:
  push:
    paths: ['.github/workflows/source-probe.yml']
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check one fixed public notice page
        shell: python
        run: |
          import datetime, json, re, socket, ssl, sys, urllib.error, urllib.request
          url = 'https://etend.setadiran.ir/etend/callMainPageCartable-anonymous.action?page=1&rows=30&sidx=publicNotificationDate&sord=desc'
          result = {
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source': 'setad_etend_public',
              'coverage': 'one_public_page_only',
              'http_status': None,
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None
          opener = urllib.request.build_opener(
              NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          request = urllib.request.Request(url, headers={
              'Accept': 'application/json', 'User-Agent': 'TenderOpportunityBot/0.1'})
          try:
              with opener.open(request, timeout=20) as response:
                  result['http_status'] = response.status
                  raw = response.read(400001)
                  if len(raw) > 400000:
                      result['outcome'] = 'response_limit'
                  else:
                      data = json.loads(raw)
                      rows = data.get('gridModel') if isinstance(data, dict) else None
                      records = data.get('records') if isinstance(data, dict) else None
                      valid = (
                          isinstance(rows, list) and len(rows) <= 30
                          and re.fullmatch(r'\d+', str(records)) is not None
                          and int(records) >= len(rows)
                          and all(isinstance(row, dict)
                              and re.fullmatch(r'[1-9]\d{5,19}', str(row.get('number'))) is not None
                              and isinstance(row.get('title'), str) for row in rows))
                      result['outcome'] = 'public_list_read' if valid else 'unexpected_response'
                      if valid:
                          result['returned_rows'] = len(rows)
                          result['reported_records'] = int(records)
          except urllib.error.HTTPError as error:
              result['http_status'] = error.code
              result['outcome'] = ('access_required' if error.code in (401, 403, 428)
                  else 'rate_limited' if error.code == 429
                  else 'redirect_requires_review' if 300 <= error.code < 400
                  else 'http_failure')
              error.close()
          except (TimeoutError, socket.timeout):
              result['outcome'] = 'timeout'
          except urllib.error.URLError as error:
              result['outcome'] = ('timeout' if isinstance(error.reason, (TimeoutError, socket.timeout))
                  else 'network_error')
          except (ValueError, UnicodeError):
              result['outcome'] = 'unexpected_response'
          except Exception:
              result['outcome'] = 'probe_error'
          print(json.dumps(result, sort_keys=True))
          sys.exit(0 if result['outcome'] == 'public_list_read' else 1)

